<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="CaseThread human-in-the-loop AI workflow: evidence uploaded, AI agent analyzes, suggestion flagged, human approves, logged in audit trail">
  <!-- CaseThread workflow pipeline (Phases.md §9 prompt 2, hand-authored).
       Palette: navy #0D1526 bg, amber #E8B04B = pending AI suggestion,
       teal #4FA8A0 = human approval / audit. Flat, minimal, seamless loop. -->
  <defs>
    <!-- Flowing dash: data moves left → right through the pipeline. -->
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E4C66"/>
      <stop offset="1" stop-color="#4FA8A0"/>
    </linearGradient>
    <!-- Agent "thinking" pulse. -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FA8A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4FA8A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="200" rx="12" fill="#0D1526"/>

  <!-- Step 1: Evidence uploaded -->
  <g>
    <rect x="28" y="52" width="132" height="72" rx="10" fill="#1B2436" stroke="#2A3650"/>
    <!-- document icon -->
    <path d="M74 68 h20 l8 8 v26 h-28 z" fill="none" stroke="#8FA1C0" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M74 82 h18 M74 88 h18 M74 94 h12" stroke="#8FA1C0" stroke-width="2" stroke-linecap="round"/>
    <text x="94" y="112" text-anchor="middle" fill="#EDEFF3" font-size="11.5">Evidence uploaded</text>
  </g>

  <!-- Arrow 1 (animated flow) -->
  <line x1="164" y1="88" x2="204" y2="88" stroke="url(#flow)" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <!-- Step 2: AI agent analyzes (pulsing glow) -->
  <g>
    <circle cx="272" cy="88" r="34" fill="url(#glow)">
      <animate attributeName="r" values="30;38;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="216" y="52" width="112" height="72" rx="10" fill="#1B2436" stroke="#2A3650"/>
    <!-- spark icon -->
    <path d="M272 66 l4.5 10.5 10.5 4.5 -10.5 4.5 -4.5 10.5 -4.5 -10.5 -10.5 -4.5 10.5 -4.5 z" fill="#4FA8A0">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <text x="272" y="112" text-anchor="middle" fill="#EDEFF3" font-size="11.5">AI agent analyzes</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="332" y1="88" x2="372" y2="88" stroke="url(#flow)" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </line>

  <!-- Step 3: Suggestion flagged (AMBER = pending, exclusively) -->
  <g>
    <rect x="384" y="52" width="132" height="72" rx="10" fill="#1B2436" stroke="#E8B04B" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <!-- flag icon -->
    <path d="M428 70 v28 M428 72 h16 l-4 7 4 7 h-16" fill="none" stroke="#E8B04B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="450" y="112" text-anchor="middle" fill="#E8B04B" font-size="11.5">Suggestion flagged</text>
    <text x="450" y="128" text-anchor="middle" fill="#E8B04B" font-size="9" opacity="0.85">AI · pending review</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="520" y1="88" x2="560" y2="88" stroke="url(#flow)" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- Step 4: Human approves (teal) -->
  <g>
    <rect x="572" y="52" width="128" height="72" rx="10" fill="#1B2436" stroke="#4FA8A0"/>
    <!-- person + check -->
    <circle cx="618" cy="72" r="6.5" fill="none" stroke="#4FA8A0" stroke-width="2.5"/>
    <path d="M606 96 c0-9 5.5-14 12-14 s12 5 12 14" fill="none" stroke="#4FA8A0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M652 74 l7 7 12-13" fill="none" stroke="#4FA8A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 40;40 0" dur="1.2s" begin="1.2s" fill="freeze" repeatCount="indefinite" repeatDur="6s"/>
    </path>
    <text x="636" y="112" text-anchor="middle" fill="#EDEFF3" font-size="11.5">Human approves</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="704" y1="88" x2="740" y2="88" stroke="url(#flow)" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Step 5: Audit trail -->
  <g>
    <rect x="752" y="52" width="100" height="72" rx="10" fill="#1B2436" stroke="#2A3650"/>
    <!-- shield-check icon -->
    <path d="M802 68 l14 5 v10 c0 8-6 13-14 16 -8-3-14-8-14-16 v-10 z" fill="none" stroke="#4FA8A0" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M795 90 l5 5 10-11" fill="none" stroke="#4FA8A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="802" y="112" text-anchor="middle" fill="#EDEFF3" font-size="11">Audit trail</text>
  </g>

  <!-- Caption -->
  <text x="440" y="168" text-anchor="middle" fill="#8FA1C0" font-size="10.5">
    AI proposes — humans decide. Every accept / edit / dismiss is logged, immutable.
  </text>
</svg>
