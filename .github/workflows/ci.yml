name: CI

# Sprint 0 CI pipeline (ExecutionPlan.md §2.2): format → analyze → test →
# web build on every PR and push to main. RLS contract tests (pgTAP) and
# migration dry-run join these gates in Sprint 2 once the schema lands.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep CI and local dev on the same minor (Rules.md §1).
          flutter-version: 3.47.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web bundle
        run: flutter build web --release

  # RLS contract tests — non-negotiable merge gate (Rules.md §7,
  # Architecture.md §12). Runs every migration + pgTAP suite against a
  # local Postgres (Docker available on GitHub-hosted runners).
  # `db reset` starts Postgres if needed, then applies migrations in
  # order — which is itself the migration dry-run gate.
  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Postgres + apply all migrations (0001→0006, ordered)
        run: supabase db reset

      - name: Run pgTAP RLS contract tests
        run: supabase test db
