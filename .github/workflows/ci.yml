name: CI

# Sprint 0 CI pipeline (ExecutionPlan.md §2.2): format → analyze → test →
# web build on every PR and push to main. RLS contract tests (pgTAP) and
# migration dry-run join these gates in Sprint 2 once the schema lands.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep CI and local dev on the same minor (Rules.md §1).
          flutter-version: 3.47.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web bundle
        run: flutter build web --release
